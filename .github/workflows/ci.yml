name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile yymbot/bot.py yymbot/smo_bridge.py base/src/services/*.py
      - run: sh -n bin/tgbot && sh -n scripts/install.sh
      - run: grep -r "BOT_TOKEN=.*:" --include="*.env" --include="*.py" --include="*.md" . | grep -v example | grep -v "PUT-YOUR" && exit 1 || echo "no secrets"
